<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)"/>
    </linearGradient>

    <linearGradient id="scanline-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)"/>
    </linearGradient>

    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.12)"/>
      <stop offset="70%" stop-color="rgba(11, 15, 25, 0.85)"/>
      <stop offset="100%" stop-color="rgba(8, 12, 20, 0.98)"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="title-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.18"/>
    </pattern>

    <style>
      @keyframes scan-anim {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }
      @keyframes pulse-neon {
        0%, 100% {
          filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.7));
          opacity: 0.95;
        }
        50% {
          filter: drop-shadow(0 0 25px rgba(0, 240, 255, 1)) drop-shadow(0 0 45px rgba(59, 130, 246, 0.8));
          opacity: 1;
        }
      }
      @keyframes blink-live {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(0.85); }
      }
      @keyframes laser-sweep {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(600px); }
      }

      .scanner-beam {
        animation: scan-anim 4.5s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Fira Code', 'JetBrains Mono', sans-serif;
        font-weight: 900;
        font-size: 42px;
        letter-spacing: 6px;
        animation: pulse-neon 4s ease-in-out infinite;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 3.5px;
        fill: #00F0FF;
      }
      .hud-code {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #00F0FF;
      }
      .live-dot {
        animation: blink-live 1.5s ease-in-out infinite;
        transform-origin: center;
      }
      .laser-motion {
        animation: laser-sweep 3s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Dark Base Surface -->
  <rect width="1200" height="320" rx="16" fill="#080C14"/>
  <rect width="1200" height="320" rx="16" fill="url(#cyber-grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid-grad)"/>

  <!-- Scanning Vertical Laser Beam -->
  <g class="scanner-beam">
    <rect x="0" y="0" width="1200" height="60" fill="url(#scanline-beam)"/>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- Outer Cyber Frame Border -->
  <rect x="12" y="12" width="1176" height="296" rx="12" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="16" y="16" width="1168" height="288" rx="10" fill="none" stroke="#3B82F6" stroke-width="0.7" stroke-opacity="0.2"/>

  <!-- Futuristic Corner HUD Brackets -->
  <path d="M 22 55 L 22 22 L 55 22" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)"/>
  <path d="M 1178 55 L 1178 22 L 1145 22" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)"/>
  <path d="M 22 265 L 22 298 L 55 298" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)"/>
  <path d="M 1178 265 L 1178 298 L 1145 298" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neon-glow)"/>

  <!-- Top System Status HUD Bar -->
  <circle cx="38" cy="38" r="4.5" fill="#00EA64" class="live-dot" filter="url(#neon-glow)"/>
  <text x="52" y="42" class="hud-code" opacity="0.95">SYSTEM: ONLINE // CLOUD_NATIVE_ARCHITECT</text>
  <text x="1162" y="42" class="hud-code" text-anchor="end" opacity="0.8">SECURITY_AUDIT: PASSED // LATENCY: 0.12ms</text>

  <!-- Central Name Title with Neon Glow -->
  <text x="600" y="136" text-anchor="middle" class="title-text" fill="url(#cyber-grad)" filter="url(#title-glow)">
    DICKY ALDIAN PRATAMA
  </text>

  <!-- Dynamic Glowing Accent Divider Line -->
  <line x1="260" y1="162" x2="940" y2="162" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
  <g class="laser-motion">
    <line x1="450" y1="162" x2="750" y2="162" stroke="url(#laser-grad)" stroke-width="2.5" filter="url(#neon-glow)"/>
  </g>
  <polygon points="600,158 605,162 600,166 595,162" fill="#00F0FF" filter="url(#neon-glow)"/>

  <!-- Subtitle Tagline -->
  <text x="600" y="200" text-anchor="middle" class="tagline-text" filter="url(#neon-glow)">
    ⚡ SOFTWARE ENGINEER • FULL-STACK ARCHITECT • CLOUD &amp; DEVOPS
  </text>

  <!-- Bottom Interactive Tech Badges in HUD -->
  <g transform="translate(255, 238)">
    <!-- Badge 1: BACKEND ARCHITECTURE -->
    <rect x="0" y="0" width="200" height="30" rx="6" fill="#0E1726" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="16" cy="15" r="3.5" fill="#00F0FF" filter="url(#neon-glow)"/>
    <text x="28" y="19" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">BACKEND ARCHITECTURE</text>

    <!-- Badge 2: AWS & CI/CD -->
    <rect x="215" y="0" width="220" height="30" rx="6" fill="#0E1726" stroke="#FF9900" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="231" cy="15" r="3.5" fill="#FF9900"/>
    <text x="243" y="19" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">AWS SERVERLESS &amp; CI/CD</text>

    <!-- Badge 3: HACKERRANK CERTIFIED -->
    <rect x="450" y="0" width="240" height="30" rx="6" fill="#0E1726" stroke="#00EA64" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="466" cy="15" r="3.5" fill="#00EA64"/>
    <text x="478" y="19" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">HACKERRANK CERTIFIED SE</text>
  </g>
</svg>
